name: Rijkswaterstaat-metingen

on:
  schedule:
    - cron: "17 * * * *"   # elk uur, kwart over (de metingen komen met wat vertraging binnen)
  workflow_dispatch: {}      # handmatig starten via het tabblad Actions

permissions:
  contents: write

concurrency:
  group: rws
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Metingen ophalen
        run: python3 rws_fetch.py data/rws.json
      - name: Opslaan als er iets veranderd is
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rws.json
          if git diff --cached --quiet; then echo "Geen wijzigingen"; exit 0; fi
          git commit -m "Metingen Rijkswaterstaat bijgewerkt"
          git push
